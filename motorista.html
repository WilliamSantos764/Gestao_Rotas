<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<title>App do Motorista - Todas as Entregas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f2f4f7;--card:#fff;--text:#101828;--muted:#667085;--line:#d0d5dd;--accent:#155eef;--ok:#027a48;--warn:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#101828;color:#fff;padding:16px;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0}header p{font-size:12px;margin:5px 0 0;color:#d0d5dd}
.wrap{max-width:820px;margin:auto;padding:12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.kpi b{display:block;font-size:17px;margin-top:3px}
.rule{background:#ecfdf3;color:#027a48;border:1px solid #abefc6;border-radius:11px;padding:10px;font-weight:850;font-size:12px;margin-bottom:10px}
#map{height:300px;border-radius:14px;border:1px solid var(--line);background:#e4e7ec;margin-bottom:10px}
.progressbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.progressline{height:9px;border-radius:999px;background:#eaecf0;overflow:hidden;margin-top:7px}.progressline i{display:block;height:100%;width:0;background:#12b76a}
.stop{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}
.stop.done{opacity:.65}.stophead{display:flex;gap:10px;align-items:flex-start}.num{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-weight:950;flex:0 0 auto}
.stop.done .num{background:#12b76a}.stop h2{font-size:15px;margin:0}
.dayblock{margin-bottom:15px}.dayhead{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 12px;background:#101828;color:white;border-radius:12px;margin:12px 0 8px}
.dayhead h2{font-size:15px;margin:0}.dayhead small{font-size:10px;color:#d0d5dd}
.daytag{font-size:10px;font-weight:900;background:#344054;border-radius:999px;padding:5px 8px}
.stopday{font-size:9px;font-weight:900;text-transform:uppercase;color:#155eef;margin-bottom:3px}
.stop .address{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px}
.distance{font-size:11px;color:var(--ok);font-weight:850;margin-top:5px}.orders{margin-top:9px;border-top:1px solid #eaecf0;padding-top:8px}
.order{font-size:12px;padding:5px 0;border-bottom:1px dashed #eaecf0}.order:last-child{border-bottom:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
button,a.btn{min-height:46px;border:0;border-radius:10px;font-size:13px;font-weight:850;display:flex;align-items:center;justify-content:center;text-decoration:none;padding:8px}
.nav{background:var(--accent);color:#fff}.donebtn{background:#ecfdf3;color:var(--ok);border:1px solid #abefc6}.stop.done .donebtn{background:#12b76a;color:#fff}
.empty{padding:25px;text-align:center;color:var(--muted)}
footer{padding:14px;text-align:center;color:var(--muted);font-size:10px}
@media(max-width:520px){.summary{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}.kpi:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1 id="title">Rota de Entregas</h1>
  <p id="subtitle">Carregando rota...</p>
</header>
<div class="wrap">
  <div class="rule">✓ Este App reúne TODAS as entregas roteirizadas do motorista. Dentro de cada dia, a sequência vai da mais perto da Cooperrita para a mais longe.</div>
  <div class="summary">
    <div class="kpi"><span>Paradas</span><b id="kStops">0</b></div>
    <div class="kpi"><span>Pedidos</span><b id="kOrders">0</b></div>
    <div class="kpi"><span>Distância</span><b id="kKm">0 km</b></div>
  </div>
  <div class="progressbox">
    <b id="progressText">0/0 entregas concluídas</b>
    <div class="progressline"><i id="progressBar"></i></div>
  </div>
  <div id="map"></div>
  <main id="stops"></main>
  <div id="error" class="empty" style="display:none"></div>
</div>
<footer>App de rota gerado pelo sistema de Gestão Logística.</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
function decodePayload(){
  const raw=(location.hash||"").slice(1);
  if(!raw)throw new Error("Link sem dados de rota.");
  let b64=raw.replace(/-/g,"+").replace(/_/g,"/");
  while(b64.length%4)b64+="=";
  const binary=atob(b64),bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes))
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function km(v){return (Number(v||0)/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" km"}
function normalizePayload(data){
  if(data?.v===2&&Array.isArray(data.routes)){
    return data
  }
  if(data?.stops?.length){
    return{
      v:2,
      type:"DRIVER_ALL_DELIVERIES",
      id:data.id||`${data.dayKey}|${data.driver}`,
      generatedAt:data.generatedAt,
      driver:data.driver,
      origin:data.origin,
      plates:data.plates||[],
      shipments:data.shipments||[],
      totalDistance:data.totalDistance||0,
      totalDuration:data.totalDuration||0,
      orderCount:data.orderCount||0,
      routedOrderCount:data.routedOrderCount||data.orderCount||0,
      routes:[{
        id:data.id,
        generatedAt:data.generatedAt,
        dayKey:data.dayKey,
        day:data.day,
        driver:data.driver,
        plates:data.plates||[],
        shipments:data.shipments||[],
        totalDistance:data.totalDistance||0,
        totalDuration:data.totalDuration||0,
        stops:data.stops||[]
      }]
    }
  }
  throw new Error("O link não possui entregas.")
}
function flatStops(app){
  const out=[];let global=0;
  (app.routes||[]).forEach((r,ri)=>(r.stops||[]).forEach((s,si)=>{
    global++;
    out.push({...s,_global:global,_routeIndex:ri,_stopIndex:si,_day:r.day||"",_dayKey:r.dayKey||"",_shipments:r.shipments||[]})
  }));
  return out
}
function uniqueOrders(app){
  const ids=new Set();
  flatStops(app).forEach(s=>(s.orders||[]).forEach(o=>o.id&&ids.add(String(o.id))));
  return ids
}
function storageKey(app){return "driver_route_done_"+String(app.id||app.driver||"rota")}
function loadDone(app){try{return JSON.parse(localStorage.getItem(storageKey(app))||"{}")}catch{return{}}}
function saveDone(app,done){localStorage.setItem(storageKey(app),JSON.stringify(done))}
function navUrl(stop){
  const dest=stop.address||(Number.isFinite(Number(stop.lat))&&Number.isFinite(Number(stop.lon))?`${stop.lat},${stop.lon}`:"");
  return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest)+"&travelmode=driving"
}
let app=null,done={},map=null;
function updateProgress(){
  const stops=flatStops(app),total=stops.length;
  const completed=stops.filter(s=>done[s._global]).length;
  $("progressText").textContent=`${completed}/${total} entregas concluídas`;
  $("progressBar").style.width=(total?completed/total*100:0)+"%"
}
function toggleDone(n){
  done[n]=!done[n];saveDone(app,done);renderStops();updateProgress()
}
function renderStops(){
 const host=$("stops");
 host.innerHTML=(app.routes||[]).map((r,ri)=>{
   const routeStops=(r.stops||[]);
   const orders=new Set();
   routeStops.forEach(s=>(s.orders||[]).forEach(o=>o.id&&orders.add(String(o.id))));
   const dayHead=`<div class="dayhead"><div><h2>${esc(r.day||"Rota")}</h2><small>Emb. ${(r.shipments||[]).map(esc).join(", ")||"—"} • ${orders.size} pedido(s)</small></div><span class="daytag">${routeStops.length} parada(s)</span></div>`;
   const cards=routeStops.map((s,si)=>{
     const global=flatStops(app).find(x=>x._routeIndex===ri&&x._stopIndex===si)?._global||(si+1);
     const isDone=!!done[global];
     return `<section class="stop ${isDone?"done":""}">
      <div class="stophead"><span class="num">${isDone?"✓":global}</span><div>
        <div class="stopday">${esc(r.day||"")}</div>
        <h2>${esc(s.name||s.city||("Parada "+global))}</h2>
        <div class="address">${esc(s.address)}<br>${esc(s.city||"")}</div>
        <div class="distance">${km(s.distanceFromDepot)} da Cooperrita</div>
      </div></div>
      <div class="orders">${(s.orders||[]).map(o=>`<div class="order"><b>Pedido ${esc(o.id)}</b>${o.clientName?` — ${esc(o.clientName)}`:""}${o.shipment?`<br><small>Embarque ${esc(o.shipment)}</small>`:""}</div>`).join("")}</div>
      <div class="actions">
        <a class="btn nav" href="${navUrl(s)}" target="_blank" rel="noopener">🧭 Navegar até esta entrega</a>
        <button class="donebtn" type="button" data-stop="${global}">${isDone?"✓ Entrega concluída":"Marcar como entregue"}</button>
      </div>
     </section>`
   }).join("");
   return `<section class="dayblock">${dayHead}${cards}</section>`
 }).join("");
 host.querySelectorAll("[data-stop]").forEach(b=>b.addEventListener("click",()=>toggleDone(Number(b.dataset.stop))))
}
function renderMap(){
 if(!window.L||!flatStops(app).length){$("map").style.display="none";return}
 map=L.map("map");
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
 const bounds=[[app.origin.lat,app.origin.lon]];
 L.circleMarker([app.origin.lat,app.origin.lon],{radius:8,color:"#101828",weight:3,fillColor:"#fff",fillOpacity:1}).addTo(map).bindPopup("<b>Cooperrita — origem</b>");
 const colors=["#155eef","#7c3aed","#059669","#d97706","#dc2626","#0891b2","#c026d3"];
 let global=0;
 (app.routes||[]).forEach((r,ri)=>{
   const pts=[[app.origin.lat,app.origin.lon]],color=colors[ri%colors.length];
   (r.stops||[]).forEach((s,si)=>{
     global++;
     pts.push([s.lat,s.lon]);bounds.push([s.lat,s.lon]);
     const icon=L.divIcon({className:"",html:`<div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${color};color:white;font-weight:900;border:2px solid white;box-shadow:0 1px 4px #555">${global}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
     L.marker([s.lat,s.lon],{icon}).addTo(map).bindPopup(`<b>${esc(r.day||"")} — entrega ${si+1}</b><br>${esc(s.name)}<br>${esc(s.address)}`)
   });
   if(pts.length>1)L.polyline(pts,{weight:5,opacity:.75,color}).addTo(map)
 });
 map.fitBounds(bounds,{padding:[20,20]})
}
try{
 app=normalizePayload(decodePayload());
 if(!flatStops(app).length)throw new Error("Este App não possui entregas.");
 done=loadDone(app);

 const orders=uniqueOrders(app);
 const days=[...new Set((app.routes||[]).map(r=>r.day).filter(Boolean))];
 const plates=[...new Set((app.routes||[]).flatMap(r=>r.plates||[]).filter(Boolean))];
 const shipments=[...new Set((app.routes||[]).flatMap(r=>r.shipments||[]).filter(x=>x!==undefined&&x!==null))];

 $("title").textContent=app.driver?`App do ${app.driver}`:"App do Motorista";
 $("subtitle").textContent=`${days.length} dia(s) • ${plates.join(" / ")||"Placa a definir"} • Emb. ${shipments.join(", ")||"—"}`;
 $("kStops").textContent=flatStops(app).length;
 $("kOrders").textContent=orders.size;
 $("kKm").textContent=km((app.routes||[]).reduce((n,r)=>n+Number(r.totalDistance||0),0));
 renderStops();updateProgress();renderMap()
}catch(e){
 $("map").style.display="none";$("stops").style.display="none";$("error").style.display="block";$("error").textContent=e.message||String(e);$("subtitle").textContent="Não foi possível abrir as entregas."
}
</script>
</body>
</html>
